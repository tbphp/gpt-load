name: V2 CI

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and build web UI
        uses: ./.github/actions/web-ci

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          # go-format-check:start
          formatted_files="$(gofmt -l .)"
          test -z "${formatted_files}"
          # go-format-check:end

      - name: Check module graph
        run: go mod tidy -diff

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build -o gpt-load .

      - name: Install Chromium for browser E2E
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run production browser E2E
        run: pnpm --dir web run test:e2e

      - name: Run race-enabled tests
        run: go test -race -count=1 . ./internal/...

      - name: Check repository invariants
        run: git diff --check

  windows-encryption-acl:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Windows secure file and storage ACLs
        run: go test -v -count=1 ./internal/platform/securefile ./internal/platform/encryption ./internal/storage
