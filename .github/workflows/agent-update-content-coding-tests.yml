name: Agent update content coding regressions

on:
  push:
    branches:
      - agent/content-coding-boundary

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/content-coding-boundary
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply updates and run focused tests
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/agent_update_content_coding_tests.py
          gofmt -w \
            internal/platform/contentcoding \
            internal/platform/httpheader \
            internal/state/runtime_settings.go \
            internal/state/runtime_settings_test.go \
            internal/dialect/pipeline.go \
            internal/dialect/pipeline_test.go \
            internal/gateway/response_representation_test.go \
            internal/gateway/forward_test.go \
            internal/gateway/dialects_integration_test.go
          set +e
          go test -count=1 ./internal/platform/contentcoding ./internal/platform/httpheader ./internal/state ./internal/dialect ./internal/gateway 2>&1 | tee .agent-content-coding-round2.log
          exit 0
      - name: Commit updates and evidence
        run: |
          rm -f .agent-content-coding-diagnostics.txt
          rm .github/scripts/agent_update_content_coding_tests.py
          rm .github/workflows/agent-update-content-coding-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align content coding regressions"
          git push origin HEAD:agent/content-coding-boundary
