name: Validate and build web UI
description: Install, validate, and build the embedded Vue application

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11.17.0
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.18.0
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install web dependencies
      shell: bash
      run: pnpm --dir web install --frozen-lockfile

    - name: Lint web source
      shell: bash
      run: pnpm --dir web run lint

    - name: Check web formatting
      shell: bash
      run: pnpm --dir web run format

    - name: Build embedded web assets
      shell: bash
      run: pnpm --dir web run build
