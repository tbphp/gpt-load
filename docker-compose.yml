services:
  gpt-load:
    image: ghcr.io/tbphp/gpt-load:2
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: gpt-load
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
      DATA_DIR: /app/data
      DATABASE_DSN: /app/data/gpt-load.db
    restart: always
    volumes:
      - gpt-load-data:/app/data
    stop_grace_period: ${CONTAINER_STOP_GRACE_PERIOD:-15s}
    healthcheck:
      test: wget -q --spider -T 10 -O /dev/null http://localhost:${PORT:-3001}/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  gpt-load-data:
