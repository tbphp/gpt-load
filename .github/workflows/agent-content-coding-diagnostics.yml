name: Agent content coding diagnostics

on:
  push:
    branches:
      - agent/content-coding-boundary

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/content-coding-boundary
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Collect diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== gofmt -l ==='
            gofmt -l .
            echo
            echo '=== go vet ==='
            go vet ./...
            echo
            echo '=== focused tests ==='
            go test -count=1 ./internal/platform/contentcoding ./internal/platform/httpheader ./internal/gateway
            echo
            echo '=== content-encoding expectations ==='
            grep -R -n -E 'Content-Encoding|CompressResponse|DecompressResponse|representation\.wire|result\.Body.*wire' internal/gateway/*_test.go internal/platform/**/*_test.go 2>/dev/null || true
            echo
            echo '=== header rule validation references ==='
            grep -R -n -E 'IsForbiddenRequestRuleSetName|HeaderRules|header_rules' internal/state internal/platform/config internal/control 2>/dev/null || true
            echo
            echo '=== compression utility references ==='
            grep -R -n -E 'DecompressResponse|CompressResponse|RegisterDecompressor|ErrDecompressedResponseTooLarge' --include='*.go' . 2>/dev/null || true
          } > .agent-content-coding-diagnostics.txt 2>&1
          exit 0

      - name: Commit diagnostics
        run: |
          rm .github/workflows/agent-content-coding-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-content-coding-diagnostics.txt .github/workflows/agent-content-coding-diagnostics.yml
          git commit -m "chore: capture content coding diagnostics"
          git push origin HEAD:agent/content-coding-boundary
