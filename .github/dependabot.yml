# 仓库已对所有 action 强制 SHA pin，上游补丁不会自动到达；由 Dependabot 提 PR
# 更新 SHA 并同步刷新其后的版本注释，保持"可审计"与"能更新"同时成立。
#
# 生效前提是 GitHub 的两条硬限制，二者都只能靠切换默认分支根治：
#   1. Dependabot 只从默认分支读取本文件。本文件位于 v2 而默认分支为 main 时，
#      下面的 version update 规则不生效。
#   2. security update 永远只针对默认分支，且一旦声明 target-branch，本文件对该
#      ecosystem 的配置就不再作用于 security update。即只要默认分支还是 main，
#      v2 的依赖漏洞就拿不到 Dependabot 的安全更新 PR，需要人工跟进。
#      https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
    groups:
      # 与下面两组保持一致：major 单独成 PR，便于评估破坏性变更。
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      # major 升级单独成 PR，便于评估破坏性变更。
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    target-branch: v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(web)
    labels:
      - dependencies
      - javascript
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
